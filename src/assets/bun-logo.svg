<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bun-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbf0df"/>
      <stop offset="100%" style="stop-color:#f3c792"/>
    </linearGradient>
  </defs>
  <!-- Bun body -->
  <ellipse cx="64" cy="72" rx="52" ry="44" fill="url(#bun-gradient)"/>
  <ellipse cx="64" cy="72" rx="52" ry="44" fill="none" stroke="#e8b87d" stroke-width="2"/>
  
  <!-- Bun top (crown/swirl) -->
  <path d="M 32 50 Q 32 28 52 25 Q 64 22 76 25 Q 96 28 96 50" fill="url(#bun-gradient)" stroke="#e8b87d" stroke-width="2"/>
  
  <!-- Left eye -->
  <ellipse cx="45" cy="68" rx="8" ry="10" fill="#3d3d3d"/>
  <ellipse cx="47" cy="66" rx="3" ry="4" fill="#ffffff"/>
  
  <!-- Right eye -->
  <ellipse cx="83" cy="68" rx="8" ry="10" fill="#3d3d3d"/>
  <ellipse cx="85" cy="66" rx="3" ry="4" fill="#ffffff"/>
  
  <!-- Blush marks -->
  <ellipse cx="30" cy="80" rx="8" ry="5" fill="#ffb6c1" opacity="0.6"/>
  <ellipse cx="98" cy="80" rx="8" ry="5" fill="#ffb6c1" opacity="0.6"/>
  
  <!-- Small smile -->
  <path d="M 55 88 Q 64 95 73 88" fill="none" stroke="#3d3d3d" stroke-width="3" stroke-linecap="round"/>
</svg>
